name: Dating pilot checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/20261013000001_dating_pilot.sql'
      - 'scripts/verify-dating-db.mjs'
      - 'package*.json'
      - '.github/workflows/dating-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:dating-db
      - run: npm run lint
      - run: npm run build
