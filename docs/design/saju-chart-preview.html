<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#faf8f4;font-family:system-ui,-apple-system,sans-serif;color:#28313b}
.wrap{max-width:390px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px} .sub{font-size:13px;color:#6b7480;margin:0 0 16px}
.daym{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.daym b{font-size:18px} .daym small{display:block;color:#6b7480;font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center}
.title{font-size:12px;color:#6b7480;font-weight:600} .tg{font-size:11px;color:#566371;min-height:14px}
.box{border:2px solid;border-radius:12px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}
.box .h{font-size:38px;line-height:1;font-family:"Noto Serif CJK KR","Noto Serif KR",serif;font-weight:700}
.box .k{font-size:11px;margin-top:6px;opacity:.9}
.box.day{outline:3px solid #7b5cff;outline-offset:2px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid} .lab{width:52px}
.bar{flex:1;height:10px;background:#eee;border-radius:6px;overflow:hidden} .bar i{display:block;height:100%}
.n{width:16px;text-align:right;color:#6b7480}
.note{font-size:11px;color:#8a929b;margin-top:14px}
</style><div class="wrap">
<h1>지민님의 사주</h1><p class="sub">예시 · 양력 1992년 10월 24일 05:30 (가짜 데이터)</p>
<div class="daym">일간 <b>계수(癸水)</b><small>나를 나타내는 글자예요 · 음의 수 기운</small></div>
<div class="grid"><div class="col">

    <div class="tg">편인</div></div><div class="col">

    <div class="box" style="background:#E8B931;color:#3A2E00;border-color:#E8B931">

    <div class="tg">정관</div></div><div class="col">

    <div class="tg">정인</div></div></div>
<div class="card"><h2>오행 분포</h2><div class="row"><span class="dot" style="background:#2E8B57;border-color:#2E8B57"></span><span class="lab">목(木)</span>

     <span class="bar"><i style="width:12.5%;background:#E8B931;border-color:#E8B931"></i></span><span class="n">1</span></div><div class="row"><span class="dot" style="background:#F4F4F2;border-color:#BDBDBD"></span><span class="lab">금(金)</span>
     <span class="bar"><i style="width:37.5%;background:#A9A9A4;border-color:#A9A9A4"></i></span><span class="n">3</span></div><div class="row"><span class="dot" style="background:#20262E;border-color:#20262E"></span><span class="lab">수(水)</span>
     <span class="bar"><i style="width:25%;background:#20262E;border-color:#20262E"></i></span><span class="n">2</span></div></div>
<p class="note">자기이해와 대화를 위한 참고예요.</p></div>
